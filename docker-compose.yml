version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: aerotwin-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: aerotwin-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - mqtt
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: aerotwin-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: unless-stopped